<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lydbølge Simulering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;box-sizing:border-box;background:#dad4c4;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;font-family:'Exo 2',sans-serif;transition:background .25s}
#wrapper{width:100%;max-width:880px}
</style>
</head>
<body>
<div id="wrapper">
<div id="sim" style="padding:.25rem 0">
<style>
#shell{border-radius:10px;overflow:hidden;border:1px solid var(--bd);transition:background .25s}
.sec{padding:10px 14px;border-bottom:1px solid var(--bd)}
.sec:last-child{border-bottom:none}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htitle{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ac);text-transform:uppercase}
.hbtns{display:flex;gap:6px}
.slbl{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.13em;color:var(--ac);text-transform:uppercase;margin:0 0 6px}
.main-row{display:flex;gap:0;border-bottom:1px solid var(--bd)}
.col-canvas{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.col-controls{width:240px;flex-shrink:0;border-left:1px solid var(--bd);padding:10px 14px;display:flex;flex-direction:column;gap:9px}
.mg4{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mc2{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:5px 7px}
.mc2.derived{border-style:dashed}
.ml2{font-family:'Share Tech Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--dim);margin:0 0 2px}
.mv2{font-family:'Courier New',monospace;font-size:13.5px;font-weight:500;margin:0;color:var(--rd);text-shadow:var(--rdg)}
.cr2{display:flex;flex-direction:column;gap:1px;margin:1px 0}
.cr2 label{font-family:'Exo 2',sans-serif;font-size:10.5px;color:var(--tx);font-weight:var(--fw);display:flex;justify-content:space-between}
.cr2 label span{font-family:'Courier New',monospace;color:var(--rd);text-shadow:var(--rdg)}
input[type=range]{accent-color:var(--ac);width:100%;height:14px;margin:0}
#cv,#oc{display:block;width:100%}
.btnrow{display:flex;gap:8px;padding:10px 14px}
.btnrow.tight{padding-top:4px;padding-bottom:10px}
.cbtn{font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border-radius:6px;cursor:pointer;transition:opacity .15s,background .15s,color .15s;background:var(--btn-bg);color:var(--btn-fg);border:1.5px solid var(--btn-fg)}
.cbtn.fx{flex:1}
.cbtn:hover{opacity:.75}
.cbtn:active{opacity:.5}
.cbtn:disabled{opacity:.30;cursor:not-allowed}
.cbtn:disabled:hover{opacity:.30}
.cbtn.active{background:var(--btn-fg);color:var(--btn-bg)}
.gas-row{display:flex;margin:0 0 7px}
.gas-btn{flex:1;font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:.06em;padding:5px 4px;background:transparent;color:var(--btn-fg);border:1px solid var(--btn-fg);cursor:pointer;text-transform:none;transition:background .15s,color .15s}
.gas-btn:first-child{border-radius:5px 0 0 5px}
.gas-btn:last-child{border-radius:0 5px 5px 0}
.gas-btn:not(:first-child){border-left:none}
.gas-btn.active{background:var(--btn-fg);color:var(--btn-bg)}
.gas-btn:hover:not(.active){opacity:.75}
.seg-group{display:flex;flex:2;min-width:0}
.cbtn.seg{flex:1;border-radius:0;letter-spacing:.06em;text-transform:none;padding-left:6px;padding-right:6px}
.cbtn.seg:first-child{border-radius:6px 0 0 6px}
.cbtn.seg:last-child{border-radius:0 6px 6px 0;border-left-width:.75px}
</style>
<div id="shell">
  <div class="sec hdr-row">
    <span class="htitle">▌ Lydbølge Simulering</span>
    <div class="hbtns">
      <button class="cbtn" id="bcopy">⊞ Kopier kode</button>
      <button class="cbtn" id="bsnd">♪ Lyd fra</button>
      <button class="cbtn" id="btn-th">◑ Mørk tilstand</button>
    </div>
  </div>
  <div class="main-row">
    <div class="col-canvas">
      <canvas id="cv" height="320"></canvas>
    </div>
    <div class="col-controls">
      <div>
        <p class="slbl">Målinger</p>
        <div class="mg4">
          <div class="mc2"><p class="ml2">v (m/s)</p><p class="mv2" id="dspd">340</p></div>
          <div class="mc2"><p class="ml2">f (Hz)</p><p class="mv2" id="dfrq">440</p></div>
          <div class="mc2 derived"><p class="ml2">λ (m) ↗</p><p class="mv2" id="dlam">0,77</p></div>
          <div class="mc2 derived"><p class="ml2">T (ms) ↗</p><p class="mv2" id="dper">2,27</p></div>
        </div>
      </div>
      <div>
        <p class="slbl">Parametre</p>
        <div class="gas-row">
          <button class="gas-btn" id="gas-he">He</button>
          <button class="gas-btn active" id="gas-air">Luft</button>
          <button class="gas-btn" id="gas-co2">CO₂</button>
        </div>
        <div class="cr2"><label>Hastighed <span style="text-transform:none">v</span> (m/s) <span id="svo">340</span></label><input type="range" id="slv" min="320" max="360" value="340" step="1"></div>
        <div class="cr2"><label>Frekvens <span style="text-transform:none">f</span> (Hz) <span id="sfo">440</span></label><input type="range" id="slf" min="170" max="1700" value="440" step="10"></div>
        <div class="cr2"><label>Amplitude <span id="samp">9</span></label><input type="range" id="slamp" min="0" max="15" value="9" step="1"></div>
        <div class="cr2"><label>Termisk støj <span id="sto">50 %</span></label><input type="range" id="slt" min="0" max="100" value="50" step="1"></div>
        <div class="cr2"><label>Animationsfart <span id="sao">1×</span></label><input type="range" id="sla" min="0.25" max="4" value="1" step="0.25"></div>
      </div>
    </div>
  </div>
  <div class="sec">
    <p class="slbl">Oscilloskop — sporet molekyle (forskydning ξ)</p>
    <canvas id="oc" height="88"></canvas>
  </div>
  <div class="btnrow">
    <button class="cbtn fx" id="bplay">⏸ Pause</button>
    <button class="cbtn fx" id="breset">↺ Nulstil</button>
  </div>
  <div class="btnrow tight">
    <div class="seg-group">
      <button class="cbtn seg active" id="bmodec">Kontinuerlig</button>
      <button class="cbtn seg" id="bmodep">Puls</button>
    </div>
    <button class="cbtn fx" id="bpuls" disabled>Send puls</button>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const oc=document.getElementById('oc'),ox=oc.getContext('2d');
let spd=340,freq=440,asp=1,therm=50,amp=9,simT=0,running=true,lastTS=null;
let mode='cont';
let pulseParams=null;
let W=600,OW=600;
const H=320,OH=88;
let darkMode=false;
const OSC_LEN=260;
const oscBuf=new Float32Array(OSC_LEN);
let oscHead=0;
const TRAIL=70;
const trailX=new Float32Array(TRAIL).fill(NaN);
const trailY=new Float32Array(TRAIL).fill(NaN);
let trailHead=0;
const VIS_SPEED=110;
const MEMX=68,MOLX0=96,MOLSP=18,MOLR=5;
const A_MEM_FACTOR=12/9;
const AMP_REF=15;
const N_CYCLES_PULSE=4;
const SPKX=4,SPKW=64;
const ROWS=[H*.10,H*.23,H*.37,H*.50,H*.63,H*.77,H*.90];
const TR_ROW=3,TR_IDX=9;
const NMOL_MAX=80;
const thermalX=[],thermalY=[];
for(let i=0;i<ROWS.length;i++){thermalX.push(new Float32Array(NMOL_MAX));thermalY.push(new Float32Array(NMOL_MAX));}

// audio
let audioCtx=null,audioOsc=null,audioGain=null,soundOn=false;

const TH={
  dk:{bg:'#0a0c14',sf:'#0f1320',bd:'#1e2a3a',tx:'#c8d8e8',dim:'#8a9bb0',ac:'#00e5ff',rd:'#a8ff3e',rdg:'0 0 8px rgba(168,255,62,.5)',fw:'300',
      btnBg:'#0a0c14',btnFg:'#00e5ff',body:'#06080e',
      mI:'#3a4860',mM:'#3a87ff',
      sB:'#15203a',sI:'#080c18',cone:'#0a1830',mem:'#00e5ff',
      wf:'rgba(0,229,255,.05)',trk:'#a8ff3e',tG:'rgba(168,255,62,.55)',
      oscB:'#080c18',oscG:'rgba(40,80,180,.22)',oscT:'#a8ff3e',oTG:'rgba(168,255,62,.7)',
      oscZ:'rgba(60,100,200,.35)',lbl:'#1a2438',lblB:'#8898ac'},
  lt:{bg:'#e8e0d2',sf:'#f4eee3',bd:'#d6cbb8',tx:'#1a1a1a',dim:'#5a503a',ac:'#2767a8',rd:'#0c6e54',rdg:'none',fw:'700',
      btnBg:'#f4eee3',btnFg:'#2767a8',body:'#dad4c4',
      mI:'#9a8c74',mM:'#1f5fbb',
      sB:'#7a6c50',sI:'#d4cab4',cone:'#a8a08c',mem:'#2767a8',
      wf:'rgba(39,103,168,.08)',trk:'#0c6e54',tG:'rgba(12,110,84,.35)',
      oscB:'#f4eee3',oscG:'rgba(31,95,187,.10)',oscT:'#0c6e54',oTG:'none',
      oscZ:'rgba(60,80,140,.28)',lbl:'#c8bda6',lblB:'#5a4f38'}
};
const c=()=>TH[darkMode?'dk':'lt'];

function fmtDk(x,dec){return (typeof x==='number'?x.toFixed(dec):String(x)).replace('.',',');}
function fmtAsp(v){return v.toString().replace('.',',')+'\u00d7';}

function applyTheme(){
  const t=c(),s=document.getElementById('shell');
  s.style.background=t.bg;
  [['--bd',t.bd],['--sf',t.sf],['--dim',t.dim],['--ac',t.ac],['--tx',t.tx],
   ['--btn-bg',t.btnBg],['--btn-fg',t.btnFg],['--rd',t.rd],['--rdg',t.rdg],['--fw',t.fw],['--bg',t.bg]]
    .forEach(([k,v])=>s.style.setProperty(k,v));
  document.body.style.background=t.body;
  document.getElementById('btn-th').textContent=darkMode?'◐ Lys tilstand':'◑ Mørk tilstand';
  document.getElementById('bplay').textContent=running?'⏸ Pause':'► Afspil';
}

function resz(){
  const nw=cv.offsetWidth||600;if(nw>0&&nw!==W){W=nw;cv.width=W;}
  const no=oc.offsetWidth||600;if(no>0&&no!==OW){OW=no;oc.width=OW;}
}

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawSpeaker(md){
  const t=c(),cy=H/2,cH=Math.round(H*.88),cY=cy-cH/2,mX=MEMX+md,cL=SPKX+15,nH=18,wH=cH-32;
  rrect(cx,SPKX,cY,SPKW,cH,5);cx.fillStyle=t.sB;cx.fill();
  rrect(cx,SPKX+5,cY+5,SPKW-11,cH-10,3);cx.fillStyle=t.sI;cx.fill();
  cx.fillStyle=t.cone;cx.beginPath();
  cx.moveTo(cL,cy-nH/2);cx.lineTo(mX,cy-wH/2);cx.lineTo(mX,cy+wH/2);cx.lineTo(cL,cy+nH/2);
  cx.closePath();cx.fill();
  cx.strokeStyle=t.sB;cx.lineWidth=1.2;
  cx.beginPath();cx.moveTo(SPKX+5,cY+5);cx.quadraticCurveTo(mX-8,cY+5,mX,cy-wH/2);cx.stroke();
  cx.beginPath();cx.moveTo(SPKX+5,cY+cH-5);cx.quadraticCurveTo(mX-8,cY+cH-5,mX,cy+wH/2);cx.stroke();
  if(darkMode){cx.shadowColor='rgba(0,229,255,.6)';cx.shadowBlur=9;}
  cx.strokeStyle=t.mem;cx.lineWidth=3;
  cx.beginPath();cx.moveTo(mX,cy-wH/2-2);cx.lineTo(mX,cy+wH/2+2);cx.stroke();
  cx.shadowBlur=0;
  cx.fillStyle=t.sB;cx.beginPath();cx.arc(cL+3,cy,6,0,Math.PI*2);cx.fill();
  cx.fillStyle=t.mem;cx.globalAlpha=.4;cx.beginPath();cx.arc(cL+3,cy,2.5,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
  cx.font='8px "Share Tech Mono",monospace';cx.textAlign='center';cx.fillStyle=t.lblB;
  cx.fillText('BØLGEGIVER',SPKX+SPKW/2,cY-4);
}

// Returns wave signal (env factor + displacement) at a molecule with given propagation delay tau.
// Continuous mode: env=1 once wavefront passes, full sine.
// Pulse mode: gaussian envelope captured at pulse-send time.
function waveSig(simT,tau,lp_cur,omega_cur){
  if(amp===0)return{env:0,disp:0};
  if(mode==='cont'){
    if(simT<tau)return{env:0,disp:0};
    return{env:1,disp:amp*Math.sin(omega_cur*(simT-tau))};
  }
  if(!pulseParams)return{env:0,disp:0};
  const tauEff=simT-pulseParams.startT-tau;
  if(tauEff<0||tauEff>pulseParams.duration)return{env:0,disp:0};
  const center=pulseParams.duration/2;
  const sig=pulseParams.duration/4;
  const env=Math.exp(-Math.pow((tauEff-center)/sig,2));
  return{env:env,disp:pulseParams.amp*env*Math.sin(pulseParams.omega*tauEff)};
}

function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixCol(c1,c2,r){
  const a=hex2rgb(c1),b=hex2rgb(c2);
  return 'rgb('+Math.round(a[0]*(1-r)+b[0]*r)+','+Math.round(a[1]*(1-r)+b[1]*r)+','+Math.round(a[2]*(1-r)+b[2]*r)+')';
}

function mCol(env){
  const t=c();
  if(env<0.01)return t.mI;
  if(env>0.99)return t.mM;
  return mixCol(t.mI,t.mM,env);
}

function updateThermal(){
  const ss=(therm/100)*3.5;
  const decay=ss===0?0.85:0.90;
  for(let r=0;r<ROWS.length;r++){
    const ax=thermalX[r],ay=thermalY[r];
    for(let i=0;i<NMOL_MAX;i++){
      ax[i]*=decay;ay[i]*=decay;
      if(ss>0){
        ax[i]+=(Math.random()+Math.random()-1)*ss*2;
        ay[i]+=(Math.random()+Math.random()-1)*ss*1.4;
      }
    }
  }
}

function drawOsc(trDisp,trEnv){
  const t=c();
  ox.fillStyle=t.oscB;ox.fillRect(0,0,OW,OH);
  if(darkMode){ox.fillStyle='rgba(0,0,8,.07)';for(let y=0;y<OH;y+=2)ox.fillRect(0,y,OW,1);}
  ox.strokeStyle=t.oscG;ox.lineWidth=.5;
  for(const v of [-1,-.5,.5,1]){const y=OH/2-v*(OH/2-11);ox.beginPath();ox.moveTo(30,y);ox.lineTo(OW,y);ox.stroke();}
  ox.strokeStyle=t.oscZ;ox.lineWidth=1;ox.beginPath();ox.moveTo(30,OH/2);ox.lineTo(OW,OH/2);ox.stroke();
  ox.strokeStyle=t.oscT;ox.lineWidth=1.6;
  if(darkMode){ox.shadowColor=t.oTG;ox.shadowBlur=5;}
  ox.beginPath();let first=true;
  for(let i=0;i<OSC_LEN;i++){
    const idx=(oscHead-OSC_LEN+i+OSC_LEN*2)%OSC_LEN;
    const x=30+(i/(OSC_LEN-1))*(OW-32),y=OH/2-oscBuf[idx]*(OH/2-11);
    first?(ox.moveTo(x,y),first=false):ox.lineTo(x,y);
  }
  ox.stroke();ox.shadowBlur=0;
  const curY=OH/2-(trDisp/AMP_REF)*(OH/2-11);
  if(darkMode){ox.shadowColor=t.oTG;ox.shadowBlur=8;}
  ox.fillStyle=t.oscT;ox.beginPath();ox.arc(OW-2,curY,3,0,Math.PI*2);ox.fill();ox.shadowBlur=0;
  ox.font='8.5px "Courier New",monospace';ox.fillStyle=t.lblB;
  ox.textAlign='left';ox.fillText('+1',2,12);ox.fillText(' 0',2,OH/2+4);ox.fillText('-1',2,OH-4);
  ox.fillStyle=t.oscT;ox.fillText('\u2195 \u03be',32,OH-4);
  ox.fillStyle=t.lblB;ox.textAlign='right';ox.fillText('tid \u2192',OW-2,OH-4);
}

function frame(){
  resz();
  const t=c();
  const lam=spd/freq;
  const lp=Math.max(38,Math.min(320,50+(lam-.1)/1.9*250));
  const k=2*Math.PI/lp,omega=2*Math.PI*VIS_SPEED/lp;
  const wfx=MEMX+VIS_SPEED*simT;

  updateThermal();

  // speaker source displacement
  const speakerSig=waveSig(simT,0,lp,omega);

  const nM=Math.min(NMOL_MAX,Math.floor((W-MOLX0-8)/MOLSP));
  const rowData=[];
  for(let ri=0;ri<ROWS.length;ri++){
    const ry=ROWS[ri],row=[];
    for(let i=0;i<nM;i++){
      const x0=MOLX0+i*MOLSP;
      const dist=x0-MEMX;
      const tau=dist/VIS_SPEED;
      const sig=waveSig(simT,tau,lp,omega);
      const tdx=thermalX[ri][i],tdy=thermalY[ri][i];
      row.push({x:x0+sig.disp+tdx,y:ry+tdy,env:sig.env,base:x0,isTrk:(ri===TR_ROW&&i===TR_IDX)});
    }
    rowData.push(row);
  }

  // tracked molecule
  const trM=rowData[TR_ROW][TR_IDX];
  const trDispVis=trM.x-trM.base;
  const trEnv=trM.env;
  oscBuf[oscHead]=trDispVis/AMP_REF;
  oscHead=(oscHead+1)%OSC_LEN;
  trailX[trailHead]=trM.x;trailY[trailHead]=trM.y;
  trailHead=(trailHead+1)%TRAIL;

  // background
  cx.fillStyle=t.bg;cx.fillRect(0,0,W,H);
  if(darkMode){cx.fillStyle='rgba(0,0,10,.07)';for(let y=0;y<H;y+=2)cx.fillRect(0,y,W,1);}

  cx.strokeStyle=t.lbl;cx.lineWidth=.5;cx.setLineDash([1,8]);
  for(let gx=MOLX0;gx<W;gx+=36){cx.beginPath();cx.moveTo(gx,0);cx.lineTo(gx,H);cx.stroke();}
  for(let gy=0;gy<H;gy+=36){cx.beginPath();cx.moveTo(MOLX0,gy);cx.lineTo(W,gy);cx.stroke();}
  cx.setLineDash([]);

  // wavefront fade (only in continuous mode with active wave)
  if(mode==='cont'&&amp>0&&wfx>MOLX0&&wfx<W+80){
    const g=cx.createLinearGradient(wfx-80,0,wfx+5,0);
    g.addColorStop(0,'transparent');g.addColorStop(1,t.wf);
    cx.fillStyle=g;cx.fillRect(wfx-80,0,85,H);
  }

  drawSpeaker(speakerSig.disp*A_MEM_FACTOR);

  // tracked vertical guide
  const trX0=MOLX0+TR_IDX*MOLSP;
  cx.strokeStyle=t.trk;cx.lineWidth=.8;cx.globalAlpha=.2;cx.setLineDash([3,5]);
  cx.beginPath();cx.moveTo(trX0,ROWS[TR_ROW]-28);cx.lineTo(trX0,ROWS[TR_ROW]+28);cx.stroke();
  cx.setLineDash([]);cx.globalAlpha=1;

  // molecules
  for(let ri=0;ri<ROWS.length;ri++){
    for(const p of rowData[ri]){
      if(p.isTrk)continue;
      cx.beginPath();cx.arc(p.x,p.y,MOLR,0,Math.PI*2);
      cx.fillStyle=mCol(p.env);cx.fill();
    }
  }

  // trail
  const rgb=darkMode?'168,255,62':'12,110,84';
  for(let i=0;i<TRAIL;i++){
    const idx=(trailHead-1-i+TRAIL)%TRAIL,tx=trailX[idx],ty=trailY[idx];
    if(isNaN(tx))break;
    cx.beginPath();cx.arc(tx,ty,1.2+2.2*(1-i/TRAIL),0,Math.PI*2);
    cx.fillStyle='rgba('+rgb+','+((1-i/TRAIL)*.5)+')';cx.fill();
  }

  // tracked molecule (always drawn)
  if(darkMode){cx.shadowColor=t.tG;cx.shadowBlur=16;}
  cx.beginPath();cx.arc(trM.x,trM.y,9,0,Math.PI*2);cx.fillStyle=t.trk;cx.fill();
  cx.strokeStyle=darkMode?'rgba(220,255,200,.6)':'rgba(255,255,255,.7)';cx.lineWidth=1.2;cx.stroke();
  cx.shadowBlur=0;
  cx.font='bold 8px "Share Tech Mono",monospace';cx.textAlign='center';cx.fillStyle=t.trk;
  cx.fillText('SPORET',trM.x,trM.y-14);

  // legend
  cx.font='8.5px "Share Tech Mono",monospace';cx.textAlign='left';
  const lY=H-6;
  const legend=[[t.mM,'aktiv'],[t.mI,'ej aktiveret'],[t.trk,'sporet']];
  legend.forEach(function(entry,i){
    const col=entry[0],lbl=entry[1];
    const lx=MOLX0+i*92;if(lx+80>W)return;
    cx.fillStyle=col;cx.beginPath();cx.arc(lx+3,lY-2,3.5,0,Math.PI*2);cx.fill();
    cx.fillStyle=t.lblB;cx.fillText(lbl,lx+10,lY);
  });

  drawOsc(trDispVis,trEnv);
}

function loop(ts){
  if(lastTS===null)lastTS=ts;
  const dt=Math.min((ts-lastTS)/1000,.05);lastTS=ts;
  if(running)simT+=dt*asp;
  frame();requestAnimationFrame(loop);
}

function upd(){
  const lam=spd/freq,p=1000/freq;
  document.getElementById('dspd').textContent=spd;
  document.getElementById('dfrq').textContent=freq;
  document.getElementById('dlam').textContent=fmtDk(lam,2);
  document.getElementById('dper').textContent=fmtDk(p,2);
}

// ---- audio ----
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioOsc=audioCtx.createOscillator();
    audioOsc.type='sine';
    audioOsc.frequency.value=freq;
    audioGain=audioCtx.createGain();
    audioGain.gain.value=0;
    audioOsc.connect(audioGain);audioGain.connect(audioCtx.destination);
    audioOsc.start();
  }catch(e){audioCtx=null;}
}
function applyAudio(){
  if(!audioCtx)return;
  audioOsc.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.02);
  const target=(soundOn&&mode==='cont'&&amp>0)?0.08*(amp/AMP_REF):0;
  audioGain.gain.setTargetAtTime(target,audioCtx.currentTime,0.05);
}

// ---- gas selector ----
const GAS_V={he:1007,air:340,co2:267};
function setGas(g){
  const v=GAS_V[g];
  spd=v;
  const slv=document.getElementById('slv');
  slv.min=v-20;slv.max=v+20;slv.value=v;
  document.getElementById('svo').textContent=v;
  ['he','air','co2'].forEach(function(x){
    document.getElementById('gas-'+x).classList.toggle('active',x===g);
  });
  upd();
}

// ---- mode + pulse ----
function setMode(m){
  mode=m;
  document.getElementById('bmodec').classList.toggle('active',m==='cont');
  document.getElementById('bmodep').classList.toggle('active',m==='puls');
  document.getElementById('bpuls').disabled=(m!=='puls');
  if(m==='cont')pulseParams=null;
  applyAudio();
}

function sendPulse(){
  if(mode!=='puls')return;
  const lam=spd/freq;
  const lp=Math.max(38,Math.min(320,50+(lam-.1)/1.9*250));
  const omega=2*Math.PI*VIS_SPEED/lp;
  pulseParams={startT:simT,lp:lp,omega:omega,amp:amp,duration:N_CYCLES_PULSE*lp/VIS_SPEED};
}

// ---- input handlers ----
document.getElementById('slv').oninput=function(){spd=+this.value;document.getElementById('svo').textContent=spd;upd();applyAudio();};
document.getElementById('slf').oninput=function(){freq=+this.value;document.getElementById('sfo').textContent=freq;upd();applyAudio();};
document.getElementById('slamp').oninput=function(){amp=+this.value;document.getElementById('samp').textContent=amp;applyAudio();};
document.getElementById('slt').oninput=function(){therm=+this.value;document.getElementById('sto').textContent=therm+' %';};
document.getElementById('sla').oninput=function(){asp=+this.value;document.getElementById('sao').textContent=fmtAsp(asp);};
document.getElementById('gas-he').onclick=function(){setGas('he');};
document.getElementById('gas-air').onclick=function(){setGas('air');};
document.getElementById('gas-co2').onclick=function(){setGas('co2');};
document.getElementById('bmodec').onclick=function(){setMode('cont');};
document.getElementById('bmodep').onclick=function(){setMode('puls');};
document.getElementById('bpuls').onclick=function(){sendPulse();};
document.getElementById('bplay').onclick=function(){running=!running;this.textContent=running?'\u23f8 Pause':'\u25b6 Afspil';if(running)lastTS=null;};
document.getElementById('breset').onclick=function(){
  simT=0;lastTS=null;oscBuf.fill(0);oscHead=0;trailX.fill(NaN);trailY.fill(NaN);trailHead=0;
  for(let r=0;r<ROWS.length;r++){thermalX[r].fill(0);thermalY[r].fill(0);}
  pulseParams=null;
  if(!running)frame();
};
document.getElementById('btn-th').onclick=function(){darkMode=!darkMode;applyTheme();};
document.getElementById('bsnd').onclick=function(){
  soundOn=!soundOn;
  if(soundOn){initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
  applyAudio();
  this.textContent=soundOn?'\u266a Lyd til':'\u266a Lyd fra';
  this.classList.toggle('active',soundOn);
};
document.getElementById('bcopy').onclick=async function(){
  const b=this,h=document.documentElement.outerHTML;
  try{await navigator.clipboard.writeText(h);}
  catch(e){const t=document.createElement('textarea');t.value=h;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  b.textContent='\u229e Kopieret!';setTimeout(function(){b.textContent='\u229e Kopier kode';},2000);
};

applyTheme();upd();requestAnimationFrame(loop);
})();
</script>
